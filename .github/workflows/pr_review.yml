name: AI Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review

  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    if: github.event_name == 'pull_request'
    runs-on:
      - self-hosted
      - ai-review
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        shell: powershell
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

          git diff `
            origin/${{ github.event.pull_request.base.ref }}...HEAD `
            > pr.diff

      - name: Build Prompt
        shell: powershell
        run: |
          $prompt = Get-Content ".github/prompts/review.md" -Raw
          $diff = Get-Content "pr.diff" -Raw

          $prompt = $prompt.Replace("{{DIFF}}", $diff)

          Set-Content "prompt.txt" $prompt

      - name: Review with OpenCode
        shell: cmd
        run: |
          type prompt.txt | opencode.cmd run > review.md

      - name: Comment Review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const review =
              fs.readFileSync('review.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body:
                '## 🤖 OpenCode Review\n\n' + review
            });

  re-review:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/opencode review')
    runs-on:
      - self-hosted
      - ai-review
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Latest Diff
        shell: powershell
        run: |
          git diff HEAD~1 HEAD > pr.diff

      - name: Build Prompt
        shell: powershell
        run: |
          $prompt = Get-Content ".github/prompts/rereview.md" -Raw
          $diff = Get-Content "pr.diff" -Raw

          $prompt = $prompt.Replace("{{DIFF}}", $diff)

          Set-Content "prompt.txt" $prompt

      - name: Review with OpenCode
        shell: cmd
        run: |
          type prompt.txt | opencode.cmd run > review.md

      - name: Comment Re-Review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const review =
              fs.readFileSync('review.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body:
                '## 🤖 OpenCode Re-Review\n\n' + review
            });
